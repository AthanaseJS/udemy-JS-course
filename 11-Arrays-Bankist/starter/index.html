<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="HTML, meta, example" />
    <link rel="shortcut icon" type="image/png" href="/icon.png" />

    <link
      href="https://fonts.googleapis.com/css?family=Poppins:400,500,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Bank List</title>
  </head>
  <body>
    <!-- TOP NAVIGATION -->
    <header>
      <nav>
        <p class="welcome" aria-label="Welcome message">
          Log in to get started
        </p>
        <img src="logo.png" alt="Bank Logo" class="logo" />
        <form class="login" aria-label="Login Form">
          <input
            type="text"
            placeholder="User"
            class="login__input login__input--user"
            aria-label="User input"
            required
          />
          <input
            type="password"
            placeholder="PIN"
            maxlength="4"
            class="login__input login__input--pin"
            aria-label="PIN input"
            required
          />
          <button type="submit" class="login__btn" aria-label="Login Button">
            &rarr;
          </button>
        </form>
      </nav>
    </header>

    <main class="app">
      <!-- BALANCE -->
      <section class="balance">
        <div>
          <p class="balance__label">Current balance</p>
          <p class="balance__date">
            As of <span class="date">05/03/2037</span>
          </p>
        </div>
        <p class="balance__value" aria-label="Current balance">0000€</p>
      </section>

      <!-- MOVEMENTS -->
      <section class="movements" aria-label="Recent Transactions">
        <div class="movements__row">
          <div class="movements__type movements__type--deposit">2 deposit</div>
          <div class="movements__date">4 days ago</div>
          <div class="movements__value">4 000€</div>
        </div>
        <div class="movements__row">
          <div class="movements__type movements__type--withdrawal">
            1 withdrawal
          </div>
          <div class="movements__date">24/01/2037</div>
          <div class="movements__value">-378€</div>
        </div>
      </section>

      <!-- SUMMARY -->
      <section class="summary">
        <p class="summary__label">In</p>
        <p class="summary__value summary__value--in">0000€</p>
        <p class="summary__label">Out</p>
        <p class="summary__value summary__value--out">0000€</p>
        <p class="summary__label">Interest</p>
        <p class="summary__value summary__value--interest">0000€</p>
        <button class="btn--sort" aria-label="Sort Transactions Button">
          &downarrow; SORT
        </button>
      </section>

      <!-- OPERATION: TRANSFERS -->
      <section class="operation operation--transfer">
        <h2>Transfer Money</h2>
        <form class="form form--transfer" aria-label="Transfer Money Form">
          <label for="transfer-to" class="form__label">Transfer to</label>
          <input
            type="text"
            id="transfer-to"
            class="form__input form__input--to"
            placeholder="Recipient"
            required
          />
          <label for="transfer-amount" class="form__label">Amount</label>
          <input
            type="number"
            id="transfer-amount"
            class="form__input form__input--amount"
            placeholder="Amount"
            required
          />
          <button type="submit" class="form__btn form__btn--transfer">
            &rarr;
          </button>
        </form>
      </section>

      <!-- OPERATION: LOAN -->
      <section class="operation operation--loan">
        <h2>Request Loan</h2>
        <form class="form form--loan" aria-label="Request Loan Form">
          <label for="loan-amount" class="form__label form__label--loan">
            Amount
          </label>
          <input
            type="number"
            id="loan-amount"
            class="form__input form__input--loan-amount"
            placeholder="Loan Amount"
            required
          />
          <button type="submit" class="form__btn form__btn--loan">
            &rarr;
          </button>
        </form>
      </section>

      <!-- OPERATION: CLOSE -->
      <section class="operation operation--close">
        <h2>Close Account</h2>
        <form class="form form--close" aria-label="Close Account Form">
          <label for="close-user" class="form__label">Confirm User</label>
          <input
            type="text"
            id="close-user"
            class="form__input form__input--user"
            placeholder="User"
            required
          />
          <label for="close-pin" class="form__label">Confirm PIN</label>
          <input
            type="password"
            id="close-pin"
            maxlength="6"
            class="form__input form__input--pin"
            placeholder="PIN"
            required
          />
          <button type="submit" class="form__btn form__btn--close">
            &rarr;
          </button>
        </form>
      </section>

      <!-- LOGOUT TIMER -->
      <p class="logout-timer" aria-label="Logout Timer">
        You will be logged out in <span class="timer">05:00</span>
      </p>
    </main>

    <!-- <footer>
      &copy; by Jonas Schmedtmann. Don't claim as your own :)
    </footer> -->

    <script src="script.js"></script>
  </body>
</html>
