<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Guess My Number!</title>
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <h1>Guess My Number!</h1>
      <p class="between">(Between 1 and 20)</p>
      <button type="button" class="btn again" aria-label="Restart the game">
        Again!
      </button>
      <div class="number" aria-label="Hidden number">?</div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Left Section: Input and Check Button -->
      <section class="left">
        <label for="guess-input" class="visually-hidden"
          >Enter your guess</label
        >
        <input
          type="number"
          id="guess-input"
          class="guess"
          min="1"
          max="20"
          placeholder="Your guess"
          required
        />
        <button type="button" class="btn check" aria-label="Check your guess">
          Check!
        </button>
      </section>

      <!-- Right Section: Messages and Scores -->
      <aside class="right">
        <p class="message" role="alert">Start guessing...</p>
        <p class="label-score">💯 Score: <span class="score">20</span></p>
        <p class="label-highscore">
          🥇 Highscore: <span class="highscore">0</span>
        </p>
      </aside>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
